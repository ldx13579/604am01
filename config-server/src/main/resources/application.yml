spring:
  datasource:
    url: jdbc:mysql://localhost:3306/config_center?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080

spring.mvc.async.request-timeout: 35000

grayscale:
  client:
    offline-threshold-minutes: 3

jwt:
  secret: MyConfigCenterJwtSecretKey2024ForHS256MustBe32BytesLong!!
  expiration-ms: 86400000
  refresh-threshold-ms: 1800000

encryption:
  master-key: AES256MasterKey32BytesLong123456

security:
  lockout:
    max-attempts: 5
    lock-duration-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: config-center

zombie:
  detection:
    threshold-days: 30
  cleanup:
    grace-period-days: 60
    auto-enabled: true
    action: ARCHIVED

config:
  change-test:
    enabled: true

alert:
  check:
    interval-ms: 30000

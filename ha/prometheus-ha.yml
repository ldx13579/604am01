global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'config-server-cluster'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'config-server-1:8080'
          - 'config-server-2:8080'
          - 'config-server-3:8080'
        labels:
          cluster: 'config-center-ha'

  - job_name: 'nginx-lb'
    static_configs:
      - targets: ['nginx-lb:80']
    metrics_path: '/nginx-health'

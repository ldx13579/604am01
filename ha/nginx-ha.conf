worker_processes auto;
events {
    worker_connections 2048;
}

http {
    upstream config_cluster {
        least_conn;
        server config-server-1:8080 max_fails=3 fail_timeout=30s;
        server config-server-2:8080 max_fails=3 fail_timeout=30s;
        server config-server-3:8080 max_fails=3 fail_timeout=30s;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # Health check endpoint for LB itself
        location /nginx-health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Long-polling requests: longer timeout
        location /api/polling {
            proxy_pass http://config_cluster;
            proxy_read_timeout 35s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # Write operations: sticky to one server
        location ~ ^/api/configs {
            proxy_pass http://config_cluster;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502;
            proxy_next_upstream_tries 3;
        }

        # All other API requests
        location /api/ {
            proxy_pass http://config_cluster;
            proxy_read_timeout 15s;
            proxy_connect_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # Actuator health for monitoring
        location /actuator/ {
            proxy_pass http://config_cluster;
            proxy_read_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
